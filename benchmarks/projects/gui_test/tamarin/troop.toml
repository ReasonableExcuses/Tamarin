[package]
name = "tamarin"
version = "0.1.0"
edition = "2026"
kind = "bin"
entry = "src/main.tmn"
links = ["raylib"]

[dependencies]

[profile.dev]
opt_level = 0
fast_math = false
crt = "dynamic"
lto = false

[profile.release]
opt_level = 3
fast_math = false
crt = "dynamic"
lto = false

[target.linux]
links = ["m", "pthread", "dl", "GL", "rt", "X11"]

[target.macos]
links = ["-framework OpenGL", "-framework Cocoa", "-framework IOKit", "-framework CoreVideo"]
lib-dirs = ["/opt/homebrew/lib", "/usr/local/lib"]

[target.windows]
links = ["winmm", "gdi32", "user32", "shell32", "opengl32"]
lib-dirs = ["../../../../lib/raylib/native"]
